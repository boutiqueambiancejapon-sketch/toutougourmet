# Safeguard : file d'attente des builds (verrou commun à tous les comptes) et journaux.
d /run/safeguard 1777 root root -
f /run/safeguard/build.lock 0666 root root -
d /var/log/safeguard 0755 root root -
f /var/log/safeguard/builds.log 0666 root root -
f /var/log/safeguard/safeguard.log 0644 root root -
d /var/lib/safeguard 0755 administrator administrator -
