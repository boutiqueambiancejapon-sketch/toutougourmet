<title>Toutou Gourmet App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : un seul site, deux visages. Vue mobile = colonne façon app avec barre d'onglets ; vue ordinateur = en-tête de navigation et grilles larges. Charte Toutou Gourmet V1, un seul thème clair assumé. */
:root {

  --ink: #1A1109;

  --orange: #E8622A;
  --orange-ink: #B4441A;
  --amber: #FFE8B5; --amber-bg: #FFF8E8; --amber-ink: #8B5A0F;
  --rose: #FFD6E3; --rose-bg: #FFF0F5; --rose-ink: #8B1A4A;
  --blue: #C8DCFF; --blue-bg: #EEF4FF; --blue-ink: #1A4E8B;
  --green: #C2F0D5; --green-bg: #E8F5EE; --green-ink: #1A7A47; --green-strong: #4CAF7D;
  --scrim: rgba(26, 17, 9, 0.45);
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-sm: 14px;
  --r-lg: 24px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--cream-2); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 900; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }

/* ---------- coquille du prototype ---------- */
.shell { height: 100%; display: flex; flex-direction: column; }
.protobar { display: flex; align-items: center; gap: 8px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--cream); flex-wrap: wrap; }
.protobar .pt { font-size: 13px; font-weight: 600; margin-right: auto; }
.protobar .seg2 { display: flex; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 3px; }
.protobar .seg2 button { border: 0; background: none; color: var(--cream); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; min-height: 34px; }
.protobar .seg2 button[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
.protobar .pb { border: 1px solid rgba(255,255,255,0.3); background: none; color: var(--cream); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; min-height: 34px; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; }

@media (min-width: 600px) {
  .shell.mob .stage { padding-block: 20px; }
  .shell.mob .app { max-width: 430px; border-radius: 30px; border: 1px solid var(--line); }
}
.main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: auto; }
.screen { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 40px; display: flex; flex-direction: column; gap: 22px; width: 100%; margin: 0 auto; }
.desk .screen { max-width: 1160px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 8px 64px; gap: 32px; }
.desk .screen.narrow { max-width: 760px; }
.d-only { display: none !important; }
.desk .d-only { display: revert !important; }
.desk .d-only.flex { display: flex !important; }

/* ---------- en-têtes ---------- */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--cream); display: flex; align-items: center; gap: 8px; min-height: 56px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.desk .topbar { position: static; max-width: 1160px; width: 100%; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.topbar .t { font-family: var(--display); font-weight: 700; font-size: 18px; flex: 1; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; font-size: 22px; display: grid; place-items: center; flex-shrink: 0; }

.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; }

.brand .w span { color: var(--orange); }
.dhead { background: var(--cream); border-bottom: 1px solid var(--line); }
.dhead-in { max-width: 1160px; margin: 0 auto; padding: 12px max(32px, env(safe-area-inset-right, 0px)) 12px max(32px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 28px; }
.dnav { display: flex; gap: 4px; flex: 1; }
.dnav button { background: none; border: 0; padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 15px; }

.dnav button[aria-current="page"] { background: var(--amber); }

/* ---------- barre d'onglets ---------- */
.tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: var(--white); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .ic { background: var(--amber); }
.tab.fab .ic { width: 58px; height: 58px; border-radius: 20px; background: var(--orange); font-size: 26px; margin-top: -26px; border: 4px solid var(--cream); }
.desk .tabbar, .desk .ctabar.m-cta { display: none; }

/* ---------- composants ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 16px; border: 0; font-weight: 600; font-size: 16px; text-decoration: none; white-space: nowrap; }

.btn:active { transform: translateY(1px); }
.link { background: none; border: 0; padding: 8px 0; color: var(--orange-ink); font-weight: 600; font-size: 15px; text-align: left; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.card.amber { background: var(--amber-bg); border-color: transparent; }
.card.rose { background: var(--rose-bg); border-color: transparent; }
.card.blue { background: var(--blue-bg); border-color: transparent; }
.card.green { background: var(--green-bg); border-color: transparent; }

.card.inkcard { background: var(--ink); border-color: transparent; color: var(--cream); }
.wm { position: absolute; right: -10px; bottom: -18px; font-size: 96px; opacity: 0.16; pointer-events: none; line-height: 1; }
.tile { width: 48px; height: 48px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; background: var(--amber); }
.tile.s { width: 36px; height: 36px; border-radius: 11px; font-size: 18px; }
.tile.l { width: 64px; height: 64px; border-radius: 20px; font-size: 32px; }
.tile.rose { background: var(--rose); } .tile.blue { background: var(--blue); } .tile.green { background: var(--green); } .tile.white { background: var(--white); }
.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); font-size: 14px; }
.small { font-size: 13px; }
.big { font-family: var(--display); font-weight: 900; letter-spacing: -0.03em; line-height: 0.95; font-variant-numeric: tabular-nums; }
.h-sec { font-size: 24px; }
.desk .h-sec { font-size: 30px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--white); border: 1px solid var(--line); white-space: nowrap; }
button.chip { min-height: 36px; }
.chip.amber { background: var(--amber); color: var(--amber-ink); border-color: transparent; }
.chip.green { background: var(--green); color: var(--green-ink); border-color: transparent; }
.chip.rose { background: var(--rose); color: var(--rose-ink); border-color: transparent; }
.chip.blue { background: var(--blue); color: var(--blue-ink); border-color: transparent; }
.chip.ink { background: var(--ink); color: var(--cream); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.list-btn { width: 100%; text-align: left; background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
.list-btn .chev { font-size: 22px; color: var(--ink-2); }
.list-btn.amber { background: var(--amber-bg); border-color: transparent; }
.list-btn.rose { background: var(--rose-bg); border-color: transparent; }
.list-btn.blue { background: var(--blue-bg); border-color: transparent; }
.list-btn.green { background: var(--green-bg); border-color: transparent; }
.lb-t { font-family: var(--display); font-weight: 700; font-size: 17px; display: block; line-height: 1.2; }
.lb-s { font-size: 14px; color: var(--ink-2); display: block; }

.img { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--cream-2); max-width: 100%; }
.img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { position: relative; border-radius: var(--r-lg); background: var(--cream-2); display: flex; align-items: flex-end; padding: 10px; overflow: hidden; max-width: 100%; }
.ph.amber { background: var(--amber); } .ph.blue { background: var(--blue); } .ph.rose { background: var(--rose); } .ph.green { background: var(--green); }
.ph .lbl { background: var(--white); border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 600; position: relative; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .fl { font-size: 14px; font-weight: 600; }
.input { min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--white); font-size: 16px; width: 100%; }
.input:focus { border-color: var(--ink); outline: none; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper button { width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--white); font-size: 26px; font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--line); flex-shrink: 0; }
.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--orange); border-radius: 999px; transition: width .3s ease; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; }
.check { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; text-align: left; min-height: 60px; }
.check .box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line-2); display: grid; place-items: center; font-size: 16px; flex-shrink: 0; color: var(--white); }

.partner { border: 1.5px dashed var(--line-2) !important; background: var(--white) !important; }

/* ---------- grilles responsives ---------- */
.split { display: grid; gap: 22px; }
.desk .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.desk .split.wide-left { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.desk .g2.to4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }

.stack { display: flex; flex-direction: column; gap: 10px; }

.arts { display: flex; flex-direction: column; gap: 16px; }

.hscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }

.desk .hscroll.to-grid > * { width: auto !important; }

/* ---------- accueil ---------- */
.hero { position: relative; }
.hero-img { position: relative; height: 230px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); overflow: hidden; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(250,250,248,0) 40%, rgba(250,250,248,0.85) 85%, var(--cream) 100%); }
.blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .35; pointer-events: none; }
.hero-txt { position: relative; margin-top: -48px; display: flex; flex-direction: column; gap: 16px; }
.desk .hero-wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: center; padding-top: 24px; }
.desk .hero-img { margin: 0; height: 440px; border-radius: 32px; order: 2; }

.stats .v { font-family: var(--display); font-weight: 900; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em; }

/* ---------- articles ---------- */
.acard { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.acard .img { aspect-ratio: 4 / 3; }

.art-layout { display: grid; gap: 28px; }

.desk .art-aside { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
.prose { display: flex; flex-direction: column; gap: 16px; font-size: 17px; line-height: 1.7; max-width: 68ch; }

/* ---------- carte d'identité, scanner, chat ---------- */
.idcard { background: var(--orange); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 14px; color: var(--ink); }
.idcard .photo { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; border: 4px solid var(--ink); position: relative; overflow: hidden; background: var(--amber); }
.idcard .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.idcard .age { background: var(--ink); color: var(--cream); border-radius: 20px; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--white); border: 1px solid var(--line); }
.step .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 600; flex-shrink: 0; border: 2px solid var(--line-2); }
.step.done .dot { background: var(--green-strong); border-color: var(--green-strong); color: var(--white); }

@keyframes beam { to { top: 88%; } }
.scanframe img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bubble { max-width: 85%; padding: 12px 14px; border-radius: 18px; font-size: 15px; line-height: 1.45; }
.bubble.me { align-self: flex-end; background: var(--ink); color: var(--cream); border-bottom-right-radius: 6px; }
.bubble.ai { align-self: flex-start; background: var(--white); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
details.acc { background: var(--white); border: 1px solid var(--line); border-radius: 18px; }

/* ---------- feuilles, toasts, barres d'action ---------- */

.sheet { background: var(--cream); border-radius: 28px 28px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 88%; overflow-y: auto; animation: up .25s ease; }
.sheet .grab { width: 44px; height: 5px; border-radius: 999px; background: var(--line-2); align-self: center; }
.desk .sheet-wrap { justify-content: center; align-items: center; padding: 24px; }
.desk .sheet { border-radius: 28px; width: 100%; max-width: 520px; padding: 24px; }
.desk .sheet .grab { display: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }

        var SOON = { croissance: ['⚖️', 'Courbe de croissance', 'Fourchette de poids adulte selon la race, mode chien croisé, alerte si le chiot sort de la zone. Phase 2.'], transition: ['🥩', 'Changer de croquettes', 'Plan jour par jour sur 7 à 10 jours et suivi des selles. Phase 3, avec offres de bienvenue des partenaires.'], budget: ['💰', 'Budget annuel', 'Coût de l\'alimentation, des soins et de l\'assurance, par pays. Prévu plus tard.'], methode: ['🔍', 'La méthode publique', 'Protéines et glucides sur matière sèche, viande en premier ingrédient, additifs. Relue par un vétérinaire, jamais influencée par l\'affiliation.'] }[d.what];
        sheet('<div class="row"><span class="tile">' + SOON[0] + '</span><div class="lb-t grow">' + SOON[1] + '</div></div><p class="muted">' + SOON[2] + '</p><button class="btn soft block" type="button" data-action="closeSheet">Fermer</button>');
        break;
      case 'startWithBreed': S.draft = null; startDraft(d.val); S.draft.breed = d.val; S.stack.push(S.screen); S.screen = 'onboard'; render(true); break;
      case 'viral': S.hasProfile = false; S.logged = false; S.stack = []; S.screen = 'home'; render(true); toast('Le gardien découvre Toutou Gourmet'); break;
      case 'toast': toast(d.msg); break;
      case 'reset': clearTimers(); clearInterval(chronoT); S = fresh(); closeSheet(); render(true); break;
    }
  });
  function doSignup() { S.logged = true; S.hasProfile = true; S.stack = ['home']; S.screen = 'dog'; render(true); toast('Compte créé · ' + S.profile.name + ' est enregistré'); }
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'ob-name') S.draft.name = t.value;
    if (t.id === 'raceq') { S.raceQuery = t.value; var pos = t.selectionStart; render(false); var n = document.getElementById('raceq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { } }
    if (t.id === 'toxq') { var k = t.value.trim().toLowerCase(); if (TOX[k]) { S.tox = k; render(false); document.getElementById('toxq').focus(); } }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'scanInput') readImg(t.files[0], function (u) { S.scanImg = u; runScan(); });
    if (t.id === 'albumInput') readImg(t.files[0], function (u) { S.album = u; render(false); toast('Photo du mois ajoutée'); });
    if (t.id === 'sitPhoto') readImg(t.files[0], function (u) { S.sitterPhoto = u; render(false); toast('Photo envoyée au maître'); });
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'signupForm') doSignup();
    if (e.target.id === 'chatForm') {
      var inp = document.getElementById('chatIn'), q = inp.value.trim(); if (!q) return;
      if (needAccount('assistant')) return;
      if (S.msgs >= (S.premium ? 300 : 20)) { go('premium'); return; }
      S.chat.push(['me', q]); S.msgs++;
      S.chat.push(['ai', 'Réponse d\'exemple : dans l\'app, l\'assistant répond en tenant compte du profil de ' + S.profile.name + ' (' + breed().name + ', ' + dec(S.profile.weight) + ' kg). Pour un symptôme, il oriente toujours vers le vétérinaire.']);
      render(false); var ci = document.getElementById('chatIn'); if (ci) ci.focus();
    }
  });
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    if (V[h] && h !== S.screen && h !== 'scanning') { if (['dog', 'carte', 'garde', 'gardien', 'assistant', 'score'].indexOf(h) > -1) S.hasProfile = true; if (h === 'onboard') S.draft = null; S.screen = guard(h); render(true); }
  });
  var h0 = location.hash.slice(1);
  if (V[h0] && h0 !== 'scanning') { if (['dog', 'carte', 'garde', 'gardien', 'assistant', 'score'].indexOf(h0) > -1) S.hasProfile = true; if (h0 === 'score') S.lastFood = SAMPLE_FOOD; S.screen = guard(h0); if (h0 !== 'home') S.stack = ['home']; }
  render(true);
})();
</script>
