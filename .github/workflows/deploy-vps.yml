# Déploie sur le VPS à chaque push sur la branche que le VPS suit.
# Avant la bascule, le VPS n'est pas public : il suit la branche v2 (valeur par défaut).
# Jour de la bascule (lot 9) : variable de repo VPS_BRANCH = claude/toutou-gourmet-setup-3mRbP.
# Inactif tant que la variable de repo VPS_DEPLOY n'est pas à "true".
# Secrets requis : VPS_HOST, VPS_SSH_KEY (clé privée autorisée pour l'utilisateur toutou).
name: Deploy VPS

on:
  push:
    branches: [v2, claude/toutou-gourmet-setup-3mRbP]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # Une seule branche alimente le VPS : vars.VPS_BRANCH, v2 par défaut.
    if: vars.VPS_DEPLOY == 'true' && github.ref_name == (vars.VPS_BRANCH || 'v2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lancer deploy.sh sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes toutou@"$HOST" "DEPLOY_BRANCH=$BRANCH /srv/toutou/deploy.sh"
