# Déploie sur le VPS à chaque push sur la branche que le VPS suit.
# Avant la bascule, le VPS n'est pas public : il suit la branche v2 (valeur par défaut).
# Jour de la bascule (lot 9) : variable de repo VPS_BRANCH = claude/toutou-gourmet-setup-3mRbP.
# Inactif tant que la variable de repo VPS_DEPLOY n'est pas à "true".
# Secrets requis : VPS_HOST, VPS_SSH_KEY (clé privée autorisée pour l'utilisateur toutou).
name: Deploy VPS

on:
  push:
    branches: [v2, claude/toutou-gourmet-setup-3mRbP]
    # Un push qui ne touche que de la documentation ne reconstruit pas le site.
    paths-ignore: ['**/*.md', 'docs/**', 'tasks/**']
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # Une seule branche alimente le VPS : vars.VPS_BRANCH, v2 par défaut.
    if: vars.VPS_DEPLOY == 'true' && github.ref_name == (vars.VPS_BRANCH || 'v2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lancer deploy.sh sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          install -m 700 -d ~/.ssh
          # La clé est souvent copiée depuis un téléphone : on retire retours chariot et espaces,
          # puis on reconstruit le format OpenSSH (lignes de 70 caractères). Une clé encodée sur
          # une seule ligne (base64 -w0 du fichier de clé) est aussi acceptée.
          # Seul le texte entre BEGIN et END est gardé (la ligne de commande copiée avec, par exemple).
          raw=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          begin='-----BEGIN OPENSSH PRIVATE KEY-----'
          end='-----END OPENSSH PRIVATE KEY-----'
          if [[ "$raw" == *"$begin"* ]]; then
            body=${raw#*"$begin"}
            body=${body%%"$end"*}
            body=$(printf '%s' "$body" | tr -cd 'A-Za-z0-9+/=')
            echo "Clé lue : ${#body} caractères (336 pour une clé ed25519 « github-actions » complète)."
            { echo "$begin"; printf '%s\n' "$body" | fold -w 70; echo "$end"; } > ~/.ssh/id_ed25519
          else
            printf '%s' "$raw" | tr -cd 'A-Za-z0-9+/=' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::Le secret VPS_SSH_KEY n'est pas une clé privée complète : la recopier en entier."; exit 1; }
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes toutou@"$HOST" "DEPLOY_BRANCH=$BRANCH /srv/toutou/deploy.sh"
